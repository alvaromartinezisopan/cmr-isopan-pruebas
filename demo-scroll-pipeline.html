<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Scroll por columna · CMR Isopan PRUEBAS</title>
<style>
:root{--isopan-blue:#0056b3}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f8fc;color:#1e293b}
.demoTop{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.demoTop h1{font-size:19px;margin:0}
.demoBadge{background:#fef3c7;color:#92600a;font-size:10px;font-weight:700;border-radius:6px;padding:3px 7px;letter-spacing:.04em}
.demoNote{font-size:12px;color:#64748b;margin:0 18px 12px;line-height:1.5}
/* --- propuesta: columnas de igual alto con scroll propio --- */
.pipeBoard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:0 18px 18px;height:calc(100vh - 118px);align-items:stretch}
.pipeColumn{border-radius:16px;background:#eaf0f7;border:1px solid #dce6f0;padding:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pipeColumn>h3{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #dce6f0;border-top:4px solid var(--c);margin:0 0 4px;flex:none}
.pipeColumn>h3 .n{font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:3px 10px}
.pipeColumn[data-phase=enviada]{--c:#0056b3}
.pipeColumn[data-phase=negociacion]{--c:#a16207}
.pipeColumn[data-phase=ganada]{--c:#0e7c4f}
.pipeColumn[data-phase=perdida]{--c:#c0392b}
.pipeColumn>p{font-size:11px;color:#64748b;margin:8px 0 12px;flex:none}
.pipeCards{overflow-y:auto;min-height:0;flex:1;padding-right:4px;scrollbar-width:thin}
.pipeCards::-webkit-scrollbar{width:6px}
.pipeCards::-webkit-scrollbar-thumb{background:#c3d2e4;border-radius:6px}
/* --- tarjetas: mismo diseño que el Pipeline actual --- */
.pipeCard{border:1px solid #d8e4f2;border-radius:10px;background:#fff;padding:11px 12px;margin-bottom:9px}
.pipeCard h3{font-size:13px;line-height:1.35;margin:0}
.pipeRef{display:flex;justify-content:space-between;align-items:center;color:#8ba0b8;font-size:9px;margin-bottom:5px}
.pipeRefPill{border-radius:7px;padding:2px 6px;font-weight:700;background:#eef4fb;color:#0056b3}
.homeLink{border:0;background:none;color:#0056b3;cursor:pointer;font-size:11px;font-weight:600}
.pipeMeta{display:flex;align-items:baseline;justify-content:space-between;gap:7px;margin:5px 0}
.pipeMeta p{margin:0;line-height:1.3;font-size:11px;color:#64748b}
.pipeMeters{font-size:12px;line-height:1.3;white-space:nowrap;margin:0;font-weight:600;color:#0056b3}
.pipePriorityPills{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.offerPill{display:inline-block;border:0;border-radius:20px;padding:3px 6px;font-size:9px;font-weight:700;line-height:1.4}
.offerLow{background:#fce9e7;color:#a74332}
.offerMid{background:#fff1cf;color:#8b650f}
.offerHigh{background:#ddf4e9;color:#14734e}
.pillNeutral{background:#eef2f7;color:#64748b}
.pipeCloseDate,.pipeAge{font-size:11px;color:#64748b;margin:3px 0}
.pipeAge.stale{color:#cf4545}
.pipeBottom{display:flex;gap:7px;align-items:center;border-top:1px solid #edf2f7;padding-top:6px;margin-top:6px}
.pipeNext{display:flex;flex-direction:column;gap:3px;font-size:11px;flex:1;min-width:0}
.pipeNext small{font-size:8px;color:#8ba0b8}
.pipeNext b{font-size:11px;overflow-wrap:anywhere}
.pipeChange{width:auto;margin:0;padding:6px 9px;font-size:10px;flex:none;min-height:34px;border:1px solid #cde3d8;background:#0e7c4f;border-radius:8px;color:#fff;cursor:pointer}
@media(max-width:900px){.pipeBoard{grid-template-columns:repeat(2,minmax(0,1fr));height:auto}
.pipeColumn{max-height:70vh}}
@media(max-width:600px){.pipeBoard{grid-template-columns:1fr;height:auto}
.pipeColumn{max-height:65vh}}
</style>
</head>
<body>
<div class="demoTop"><h1>Ofertas</h1><span class="demoBadge">DEMO · Scroll por columna</span></div>
<p class="demoNote">Ejemplo interactivo para probar la propuesta: todas las columnas tienen la misma altura y cada una se desplaza por dentro, sin mover las demás. Los datos son ficticios; nada aquí toca el CMR.</p>
<div class="pipeBoard" id="board"></div>
<script>
const FASES=[
 {key:'enviada',label:'Enviadas',n:12},
 {key:'negociacion',label:'En negociación',n:5},
 {key:'ganada',label:'Ganadas',n:9},
 {key:'perdida',label:'Perdidas',n:3}
];
const CLIENTES=['FICTICIO NORTE SL','NAVES AURORA SL','PRUEBA SALUDO SL','UI TEST SL','PANELES ATLÁNTICO','NAVES HORIZONTE','LOGÍSTICA LEVANTE','ALMACENES SUR SL'];
const PROD=['Cubierta','Fachada','Panel frigorífico'];
const PROV=['Navarra','Madrid','Girona','Almería','Álava','Barcelona','Sevilla','Valencia'];
function prob(i){const p=[10,20,50,50,90][i%5];return {p,cls:p<=30?'offerLow':p>=70?'offerHigh':'offerMid',txt:p+'%· '+(p<=30?'Baja':p>=70?'Alta':'Media')}}
function card(fase,i){const pr=prob(i+fase.n);const dias=(i*7+fase.n)%24;const metros=100+((i*137+fase.n*53)%1900);
 return `<article class="pipeCard${dias>=10?' pipeStale':''}">
  <div class="pipeRef"><span class="pipeRefPill">DEMO-${fase.key.slice(0,3).toUpperCase()}-${String(i+1).padStart(2,'0')}</span><button type="button" class="homeLink">Ver</button></div>
  <h3>${CLIENTES[(i+fase.label.length)%CLIENTES.length]}</h3>
  <div class="pipeMeta"><p>${PROD[i%3]} · ${PROV[(i*3+fase.n)%PROV.length]}</p><b class="pipeMeters">${metros.toLocaleString('es-ES')} m²</b></div>
  <div class="pipePriorityPills"><span class="offerPill ${pr.cls}">${pr.txt}</span>${i%3===0?'<span class="offerPill pillNeutral">Sin próximo paso</span>':''}</div>
  <p class="pipeCloseDate">Cierre estimado: ${i%4===0?'Sin fecha':(10+i%18)+'/12/2026'}</p>
  <p class="pipeAge${dias>=10?' stale':''}">${dias===0?'0 días sin actividad':dias+(dias===1?' día':' días')+' sin actividad'}</p>
  <div class="pipeBottom"><div class="pipeNext"><small>Próximo:</small><b>${i%3===0?'Sin próximo paso':['Llamar para cerrar visita','Enviar documentación','Revisar especificaciones'][i%3]}</b></div><button class="pipeChange" type="button">Seguimiento</button></div>
 </article>`}
document.getElementById('board').innerHTML=FASES.map(f=>{
 const cards=Array.from({length:f.n},(_,i)=>card(f,i)).join('');
 const metros=Array.from({length:f.n},(_,i)=>100+((i*137+f.n*53)%1900)).reduce((a,b)=>a+b,0);
 return `<section class="pipeColumn" data-phase="${f.key}"><h3>${f.label}<span class="n">${f.n}</span></h3><p>${f.n} ${f.n===1?'oferta':'ofertas'} · ${metros.toLocaleString('es-ES')} m²</p><div class="pipeCards">${cards}</div></section>`;
}).join('');
</script>
</body>
</html>
